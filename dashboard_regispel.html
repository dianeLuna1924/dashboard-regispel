<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISPEL - Dashboard Executivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; color: #0f172a; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .card-dash { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 16px; box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.05); transition: transform 0.15s ease, box-shadow 0.15s ease; }
        .card-dash:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -3px rgba(15, 23, 42, 0.08); }
        .card-kpi-indigo { background: linear-gradient(135deg, #ffffff 0%, #e0e7ff 100%); border-left: 5px solid #6366f1; }
        .card-kpi-blue { background: linear-gradient(135deg, #ffffff 0%, #eff6ff 100%); border-left: 5px solid #3b82f6; }
        .card-kpi-amber { background: linear-gradient(135deg, #ffffff 0%, #fffbeb 100%); border-left: 5px solid #f59e0b; }
        .card-kpi-emerald { background: linear-gradient(135deg, #ffffff 0%, #ecfdf5 100%); border-left: 5px solid #10b981; }
        .card-kpi-rose { background: linear-gradient(135deg, #ffffff 0%, #fff1f2 100%); border-left: 5px solid #ef4444; }
        
        /* Estilo da Tabela Menor com Rolagem e Cabeçalho Fixo */
        .table-scroll-container { max-height: 280px; overflow-y: auto; overflow-x: auto; }
        .table-scroll-container thead th { position: sticky; top: 0; z-index: 10; background-color: #1e293b; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-[1600px] mx-auto">

    <!-- Header Principal -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 pb-4 border-b border-slate-300 gap-4">
        <div>
            <div class="flex items-center gap-3">
                <span class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-md uppercase tracking-wider shadow-sm">REGISPEL</span>
                <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">Painel Comercial de Orçamentos</h1>
            </div>
            <p class="text-slate-500 text-sm mt-1 font-medium">Análise e Acompanhamento de Vendas (Base: BASE_ORCAMENTOS)</p>
        </div>
        <div class="flex flex-wrap gap-3">
            <label class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm px-4 py-2.5 rounded-xl cursor-pointer flex items-center gap-2 transition shadow-md">
                <i class="fa-solid fa-file-excel"></i> Carregar Planilha Local
                <input type="file" id="inputExcel" accept=".xlsx, .xls, .xlsm" class="hidden">
            </label>
            <button id="btnLimpar" class="bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-semibold text-sm px-4 py-2.5 rounded-xl transition shadow-sm">
                <i class="fa-solid fa-arrows-rotate mr-1.5 text-slate-400"></i> Limpar Filtros
            </button>
        </div>
    </header>

    <!-- Status de Carregamento Automático -->
    <div id="statusCarregamento" class="mb-6 p-4 bg-blue-50 border border-blue-200 text-blue-800 text-xs font-semibold rounded-xl flex items-center gap-3 shadow-sm">
        <i class="fa-solid fa-circle-notch fa-spin text-base text-blue-600"></i>
        <span id="textoStatus">A carregar dados da planilha do servidor...</span>
    </div>

    <!-- Filtros Superiores Limpos -->
    <div class="card-dash p-4 mb-6 grid grid-cols-2 md:grid-cols-6 gap-3">
        <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Ano</label>
            <select id="filtroAno" class="w-full mt-1 bg-slate-50 border border
